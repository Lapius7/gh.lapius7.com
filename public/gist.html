<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gist · GitHub</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lapius7 · GitHub">
<meta property="og:title" content="Gist · GitHub">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232ecc8f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css?v=20261121e">
</head>
<body class="loading">
<div id="tip"></div>
<button class="theme" id="theme" aria-label="Toggle theme">◐</button>
<div class="banner"><canvas id="bn"></canvas></div>
<main class="wrap">
  <div id="loader" role="status" aria-live="polite"><div class="wave" aria-hidden="true"></div><span>Loading gist<b class="dots"></b></span></div>
  <a class="back" href="/gists">← Gists</a>
  <header class="rhead">
    <h1 id="gname"></h1>
    <p class="rdesc" id="gdesc"></p>
    <div class="chips" id="gmeta"></div>
  </header>
  <nav class="tabs" id="gtabs" aria-label="Files"></nav>
  <div class="gview"><div class="viewer" id="viewer" hidden></div></div>
</main>
<script src="/common.js?v=20261012d"></script>
<script type="text/page">
const ID = location.pathname.split('/')[2] || '';
const fail = (m) => { $('gname').textContent = m; document.body.classList.remove('loading'); };
const EXT = { ts: 'typescript', tsx: 'typescript', js: 'javascript', jsx: 'javascript', mjs: 'javascript', cjs: 'javascript', json: 'json', css: 'css', scss: 'scss', html: 'xml', xml: 'xml', svg: 'xml', py: 'python', rs: 'rust', go: 'go', sh: 'bash', bash: 'bash', zsh: 'bash', md: 'markdown', yml: 'yaml', yaml: 'yaml', toml: 'ini', ini: 'ini', java: 'java', kt: 'kotlin', c: 'c', h: 'c', cpp: 'cpp', cs: 'csharp', php: 'php', rb: 'ruby', sql: 'sql', lua: 'lua', swift: 'swift', ps1: 'powershell', vue: 'xml', nsi: 'ini', dockerfile: 'dockerfile' };
const LN = { typescript: 'TypeScript', javascript: 'JavaScript', json: 'JSON', css: 'CSS', scss: 'SCSS', xml: 'HTML / XML', python: 'Python', rust: 'Rust', go: 'Go', bash: 'Shell', markdown: 'Markdown', yaml: 'YAML', ini: 'Config', java: 'Java', kotlin: 'Kotlin', c: 'C', cpp: 'C++', csharp: 'C#', php: 'PHP', ruby: 'Ruby', sql: 'SQL', lua: 'Lua', swift: 'Swift', powershell: 'PowerShell', dockerfile: 'Dockerfile' };
const extOf = (p) => { const b = p.split('/').pop().toLowerCase(); return b.includes('.') ? b.split('.').pop() : b; };
const splitLines = (html) => {
const out = [], stack = [], re = /<span[^>]*>|<\/span>|\n/g;
let cur = '', last = 0, m;
while ((m = re.exec(html))) {
cur += html.slice(last, m.index); last = re.lastIndex;
if (m[0] === '\n') { out.push(cur + '</span>'.repeat(stack.length)); cur = stack.join(''); }
else { m[0] === '</span>' ? stack.pop() : stack.push(m[0]); cur += m[0]; }
}
out.push(cur + '</span>'.repeat(stack.length));
return out;
};
let hlp;
const hlLines = async (text, lang) => {
if (!lang || text.length > 120000) return null;
try {
hlp ||= import('https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/+esm');
const m = (await hlp).default;
return splitLines(m.highlight(text, { language: lang, ignoreIllegals: true }).value);
} catch { return null; }
};
const fmt = (n) => n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';
(async () => {
  try {
    const r = await fetch('/api/gist?id=' + encodeURIComponent(ID));
    if (!r.ok) throw 0;
    const g = await r.json();
    const first = g.files[0] || {};
    document.title = (first.name || 'Gist') + ' · GitHub';
    $('gname').textContent = first.name || ID;
    $('gdesc').textContent = g.description || '';
    $('gmeta').innerHTML = `<span class="chip">${g.files.length} file${g.files.length > 1 ? 's' : ''}</span><span class="chip">updated ${new Date(g.updated).toLocaleDateString('en-CA')}</span><a class="chip" href="${esc(g.url)}" target="_blank" rel="noopener">View on GitHub</a>`;
    let cur = 0, seq = 0;
    const wrapPref = () => { try { return localStorage.getItem('srcwrap') === '1'; } catch { return false; } };
    const show = async (idx) => {
      cur = idx; const f = g.files[idx], tok = ++seq, lang = EXT[extOf(f.name)];
      $('gtabs').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === idx));
      const lines = f.content.replace(/\n$/, '').split('\n'), wrap = wrapPref();
      const v = $('viewer'); v.hidden = false;
      v.innerHTML = `<div class="v-head"><div class="v-title"><span class="v-name"><b>${esc(f.name)}</b></span></div><div class="v-meta">${LN[lang] || 'Plain text'} · ${lines.length.toLocaleString()} lines · ${fmt(f.content.length)}</div><div class="v-acts"><button type="button" data-a="wrap" aria-pressed="${wrap}">Wrap</button><button type="button" data-a="copy">Copy</button><a href="${esc(g.url)}#file-${esc(f.name.replace(/[^A-Za-z0-9]+/g, '-').toLowerCase())}" target="_blank" rel="noopener">GitHub</a></div></div>` + (f.truncated ? '<div class="v-state">Truncated. Open on GitHub for the full file.</div>' : '') + `<div class="code${wrap ? ' wrap' : ''}" role="region" aria-label="${esc(f.name)}" tabindex="0">${lines.map((l, i) => `<div class="l"><span class="n" data-n="${i + 1}"></span><span class="c">${esc(l)}</span></div>`).join('')}</div>`;
      const code = v.querySelector('.code');
      v.querySelector('.v-acts').onclick = async (e) => {
        const btn = e.target.closest('button'); if (!btn) return;
        if (btn.dataset.a === 'wrap') { const on = !code.classList.contains('wrap'); code.classList.toggle('wrap', on); btn.setAttribute('aria-pressed', on); try { localStorage.setItem('srcwrap', on ? '1' : '0'); } catch {} }
        else if (btn.dataset.a === 'copy') { try { await navigator.clipboard.writeText(f.content); btn.textContent = 'Copied'; } catch { btn.textContent = 'Failed'; } setTimeout(() => { btn.textContent = 'Copy'; }, 1400); }
      };
      const hl = await hlLines(f.content.replace(/\n$/, ''), lang);
      if (hl && tok === seq) code.querySelectorAll('.c').forEach((el, i) => { el.innerHTML = hl[i]; });
    };
    $('gtabs').innerHTML = g.files.map((f, i) => `<button type="button" data-i="${i}">${esc(f.name)}</button>`).join('');
    $('gtabs').hidden = g.files.length < 2;
    $('gtabs').onclick = (e) => { const b = e.target.closest('button'); if (b) { show(+b.dataset.i); history.replaceState(null, '', location.pathname + '#' + encodeURIComponent(g.files[+b.dataset.i].name)); } };
    const want = decodeURIComponent(location.hash.slice(1)), wi = g.files.findIndex((f) => f.name === want);
    await show(wi >= 0 ? wi : 0);
    document.body.classList.remove('loading');
  } catch { fail('Gist not found'); }
})();
window.SPA_PAGE = null;
</script>
