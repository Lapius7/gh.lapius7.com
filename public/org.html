<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organization · GitHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232ecc8f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css?v=20261017d">
<style>
.profile img.sq{border-radius:14px}
.stats.s2{margin-top:0}
</style>
</head>
<body class="loading">
<div id="tip"></div>
<button class="theme" id="theme" aria-label="Toggle theme">◐</button>
<div class="banner"><canvas id="bn"></canvas></div>
<main class="wrap">
  <div id="loader" role="status" aria-live="polite"><div class="wave" aria-hidden="true"></div><span>Loading GitHub data<b class="dots"></b></span></div>
  <div class="profile">
    <img id="avatar" class="sq" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    <div><h1 id="name">…</h1><a id="link" href="#"></a><div class="meta" id="meta"></div></div>
  </div>
  <nav class="crumbs" id="crumbs"></nav>

  <section id="app" class="skeleton">
    <div class="tabs ptabs" id="ptabs" role="tablist">
      <button data-p="overview" class="on">Overview</button><button data-p="work">Work</button><button data-p="activity">Activity</button><button data-p="repos">Repositories</button></div>
    <div class="pane" data-p="overview">
    <div class="stats" id="stats"></div>
    <div class="stats s2" id="stats2"></div>

    <section class="blk"><h2>Languages</h2><div class="stack" id="langstack"></div><div class="key" id="langkey"></div></section>
    </div>
    <div class="pane" data-p="work" hidden>
    <section class="blk" id="pinnedblk" hidden style="margin-top:0"><h2>Pinned</h2><div class="cards" id="pinned"></div></section>
    <section class="blk"><div class="tabs" id="tabs">
      <button data-k="prs" class="on">Open PRs</button><button data-k="issues">Open issues</button></div>
      <div id="openlist"></div></section>
    </div>
    <div class="pane" data-p="activity" hidden>
    <section class="blk" style="margin-top:0"><h2>Recent activity</h2><div id="events"></div></section>
    <section class="blk"><h2>GitHub Actions</h2><div id="runs"></div></section>
    </div>
    <div class="pane" data-p="repos" hidden>
  <div class="search" style="margin-bottom:24px">
    <input id="q" placeholder="Search repositories…" autocomplete="off" aria-label="Search repositories">
    <div class="foot"><span>Filters the repository list below</span><span id="repocount"></span></div>
  </div>

    <section class="blk repos" style="margin-top:0"><h2>Repositories</h2><div id="repos"></div></section>
    </div>
  </section>
  <p class="foot2" id="foot"></p>
</main>
<script src="/common.js?v=20261012d"></script>
<script>
let repos = [];
const stack = (parts) => { const t = parts.reduce((s,p) => s + p.v, 0) || 1;
  return [parts.map(p => `<i style="width:${p.v/t*100}%;background:${p.c}"></i>`).join(''),
          parts.map(p => `<span><span class="dot" style="background:${p.c}"></span>${esc(p.n)}<b>${p.v.toFixed(1)}%</b></span>`).join('')]; };
const stat = (l, n, sub = '') => `<div class="stat"><div class="label">${l}</div><div class="num">${n}</div><div class="label">${sub}</div></div>`;

function drawRepos(){
  const q = $('q').value.trim().toLowerCase();
  const list = repos.filter(r => !q || (r.name + ' ' + (r.description||'')).toLowerCase().includes(q));
  $('repocount').textContent = `${list.length} / ${repos.length}`;
  $('repos').innerHTML = list.map(r => `<a class="repo" href="${esc(r.url)}" target="_blank" rel="noopener">
    <div><div class="rn">${esc(r.name)}</div><div class="rd">${esc(r.description || '')}</div></div>
    <div class="rm">${r.primaryLanguage ? `<span class="dot" style="background:${esc(r.primaryLanguage.color||'#888')}"></span>${esc(r.primaryLanguage.name)}` : ''}${r.stargazerCount ? ` · ★ ${r.stargazerCount}` : ''}<br>${new Date(r.pushedAt).toLocaleDateString()}</div></a>`).join('')
    || '<div class="rd" style="padding:12px 0">No match</div>';
}

S = null;
let openPage = 0, openKey = 'prs';
const PER = 10;
function drawOpen(k, page){
  if (k !== openKey) openPage = 0;
  openKey = k; if (page != null) openPage = page;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  const o = S.open[k], pages = Math.max(1, Math.ceil(o.items.length / PER));
  openPage = Math.min(openPage, pages - 1);
  const rows = o.items.slice(openPage * PER, (openPage + 1) * PER);
  $('openlist').innerHTML = rows.length ? rows.map(i => `<a class="item" href="${esc(i.url)}" target="_blank" rel="noopener"><div><div class="t">${esc(i.title)}</div><div class="s">${esc(i.repo)}</div></div><div class="r">${ago(i.at)}</div></a>`).join('')
    + (pages > 1 ? `<div class="pager"><button data-d="-1"${openPage === 0 ? ' disabled' : ''}>Prev</button><span>${openPage + 1} / ${pages} · ${o.total} total</span><button data-d="1"${openPage >= pages - 1 ? ' disabled' : ''}>Next</button></div>` : '') : '<div class="empty">Nothing here</div>';
}
$('openlist').addEventListener('click', (e) => {
  const b = e.target.closest('.pager button'); if (b && !b.disabled) drawOpen(openKey, openPage + Number(b.dataset.d));
});

$('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) drawOpen(b.dataset.k); });
function render(s){
  S = s;
  document.body.classList.remove('loading');
  $('app').classList.remove('skeleton');
  const o = s.org;
  $('avatar').src = o.avatar;
  $('name').textContent = o.name || o.login;
  $('link').href = o.url; $('link').textContent = '@' + o.login + (o.description ? ' · ' + o.description : '');
  document.title = `${o.name || o.login} · GitHub`;
  $('meta').innerHTML = [o.location, o.website && `<a href="${esc(o.website)}" target="_blank" rel="noopener">${esc(o.website.replace(/^https?:\/\//,''))}</a>`].filter(Boolean).map(x => `<span>${x.startsWith('<') ? x : esc(x)}</span>`).join('');
  $('crumbs').innerHTML = [{ login: s.me.login, avatarUrl: s.me.avatarUrl, href: '/', org: false }, ...s.orgNames.map(n => ({ ...n, href: '/' + n.login, org: true }))]
    .map(n => `<a class="ic ${n.org ? 'org' : ''} ${n.login.toLowerCase() === o.login.toLowerCase() ? 'on' : ''}" href="${esc(n.href)}" title="${esc(n.login)}" aria-label="${esc(n.login)}"><img src="${esc(n.avatarUrl)}" alt=""></a>`).join('');
  const t = s.totals;
  $('stats').innerHTML = stat('Repositories', t.repos) + stat('Stars', t.stars.toLocaleString()) + stat('Forks', t.forks.toLocaleString()) + stat('Members', o.members);
  $('stats2').innerHTML = stat('Open PRs', t.openPrs.toLocaleString()) + stat('Open issues', t.openIssues.toLocaleString()) + stat('Teams', o.teams) + stat('Created', new Date(o.createdAt).toLocaleDateString());

  const [ls, lk] = stack(s.languages.map(l => ({ n: l.name, v: l.pct, c: l.color || '#888' })));
  $('langstack').innerHTML = ls; $('langkey').innerHTML = lk || '<span>No language data</span>';

  drawOpen('prs');
  $('pinnedblk').hidden = !s.pinned.length;
  $('pinned').innerHTML = s.pinned.map(r => `<a class="card" href="${esc(r.url)}" target="_blank" rel="noopener"><div class="rn">${esc(r.name)}</div><div class="rd">${esc(r.description || '')}</div><div class="rd" style="margin-top:8px">${r.primaryLanguage ? `<span class="dot" style="background:${esc(r.primaryLanguage.color||'#888')}"></span>${esc(r.primaryLanguage.name)} · ` : ''}★ ${r.stargazerCount} · ⑂ ${r.forkCount}</div></a>`).join('');

  $('events').innerHTML = s.events.map(e => `<a class="item" href="${esc(e.url || '#')}" target="_blank" rel="noopener"><div><div class="t">${esc(e.text)}</div><div class="s">${esc(e.actor)}${e.detail ? ' · ' + esc(e.detail) : ''}</div></div><div class="r">${ago(e.at)}</div></a>`).join('') || '<div class="empty">No recent public activity</div>';
  $('runs').innerHTML = s.runs.map(r => { const st = r.status !== 'completed' ? ['run','● running'] : r.conclusion === 'success' ? ['ok','✓ success'] : ['bad','✕ ' + (r.conclusion || 'failed')];
    return `<a class="item" href="${esc(r.url)}" target="_blank" rel="noopener"><div><div class="t">${esc(r.name)}</div><div class="s">${esc(r.repo)}</div></div><div class="r ${st[0]}">${st[1]} · ${ago(r.at)}</div></a>`; }).join('') || '<div class="empty">No workflow runs</div>';

  repos = s.repos; drawRepos();
  $('foot').textContent = `Updated ${new Date(s.generatedAt).toLocaleString()} · GitHub API`;
}

const PANES = ['overview', 'work', 'activity', 'repos'];
const orgName = location.pathname.split('/')[1];
const paneFromPath = () => { const p = location.pathname.split('/')[2]; return PANES.includes(p) ? p : 'overview'; };
function showPane(p){
  document.querySelectorAll('#ptabs button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  document.querySelectorAll('.pane').forEach(el => { el.hidden = el.dataset.p !== p; });
}
$('ptabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  showPane(b.dataset.p); history.pushState(null, '', `/${orgName}/${b.dataset.p}`);
});
addEventListener('popstate', () => showPane(paneFromPath()));
showPane(paneFromPath());
$('q').oninput = drawRepos;
(async () => {
  const name = location.pathname.split('/')[1];
  try {
    const r = await fetch('/api/org?name=' + encodeURIComponent(name));
    if (!r.ok) throw 0;
    const o = await r.json();
    render(o);
    // Warm the browser cache for the other pages reachable from here.
    (window.requestIdleCallback || setTimeout)(() => {
      ['/api/stats?period=week', ...(o.orgNames || []).filter((n) => n.login.toLowerCase() !== name.toLowerCase()).map((n) => '/api/org?name=' + encodeURIComponent(n.login))].forEach((u) => fetch(u).catch(() => {}));
    });
  } catch { document.body.classList.remove('loading'); $('app').classList.remove('skeleton'); $('app').insertAdjacentHTML('afterbegin', '<div class="err">Failed to load organization.</div>'); }
})();
</script>
</body>
</html>
