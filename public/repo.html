<script src="/common.js"></script>
<script type="text/page">
(async () => {
  const p = location.pathname.replace(/^\/repos\//, '').split('/').filter(Boolean);
  try {
    const r = await fetch('/api/repo?name=' + encodeURIComponent(p.join('/')));
    if (!r.ok) throw 0;
    const d = await r.json();
    $('rname').innerHTML = `<span>${esc(d.owner)}/</span>${esc(d.name)}`;
    $('rdesc').textContent = d.description || '';
    const n = (x) => Number(x).toLocaleString();
    const base = d.base, SUB = document.querySelector('meta[name=x-sub]').content;
    $('chips').innerHTML = [
      d.language && `<span class="chip"><i class="dot" style="background:${esc(d.langColor || '#888')}"></i>${esc(d.language)}</span>`,
      `<a class="chip" href="${base}/stars">★ ${n(d.stars)}</a>`, `<a class="chip" href="${base}/forks">⑂ ${n(d.forks)}</a>`,
      `<a class="chip" href="${base}/issues">${n(d.issues)} issues</a>`, d.license && `<a class="chip" href="${base}/license">${esc(d.license)}</a>`,
      d.archived && `<span class="chip">archived</span>`, `<span class="chip">updated ${ago(d.pushedAt)}</span>`,
    ].filter(Boolean).join('');
    $('topics').innerHTML = d.topics.map((t) => `<span class="topic">${esc(t)}</span>`).join('');
    $('acts').innerHTML = `<a class="btn pri" href="${esc(d.url)}" target="_blank" rel="noopener">Open on GitHub ↗</a>` +
      (d.homepage ? `<a class="btn" href="${esc(d.homepage)}" target="_blank" rel="noopener">${esc(d.homepage.replace(/^https?:\/\//, '').replace(/\/$/, ''))} ↗</a>` : '') +
      (d.release ? `<a class="btn" href="${esc(d.release.url)}" target="_blank" rel="noopener">${esc(d.release.tag)}</a>` : '');
    const tot = d.languages.reduce((a, l) => a + l.bytes, 0) || 1;
    $('stack').innerHTML = d.languages.map((l) => `<i style="width:${l.bytes / tot * 100}%;background:${esc(l.color)}"></i>`).join('');
    $('key').innerHTML = d.languages.map((l) => `<span><i class="dot" style="background:${esc(l.color)}"></i>${esc(l.name)}<b>${(l.bytes / tot * 100).toFixed(1)}%</b></span>`).join('');
    $('contribs').innerHTML = d.contributors.map((c) => `<a class="av" href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.login)} · ${c.n}"><img src="${esc(c.avatar)}&s=64" alt=""><span>${esc(c.login)}</span><b>${n(c.n)}</b></a>`).join('');
    if (!d.contributors.length) $('contribBlk').hidden = true;
    if (d.readme) $('readme').innerHTML = d.readme; else $('readmeBlk').hidden = true;

    const REFS = [...d.branches, ...d.tags];

    build();
    const fmt = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
    const EXT = { ts: 'typescript', tsx: 'typescript', js: 'javascript', jsx: 'javascript', mjs: 'javascript', cjs: 'javascript', json: 'json', css: 'css', scss: 'scss', html: 'xml', xml: 'xml', svg: 'xml', py: 'python', rs: 'rust', go: 'go', sh: 'bash', bash: 'bash', zsh: 'bash', md: 'markdown', yml: 'yaml', yaml: 'yaml', toml: 'ini', ini: 'ini', java: 'java', kt: 'kotlin', c: 'c', h: 'c', cpp: 'cpp', cs: 'csharp', php: 'php', rb: 'ruby', sql: 'sql', lua: 'lua', swift: 'swift', ps1: 'powershell', vue: 'xml', nsi: 'ini', dockerfile: 'dockerfile' };
    const LN = { typescript: 'TypeScript', javascript: 'JavaScript', json: 'JSON', css: 'CSS', scss: 'SCSS', xml: 'HTML / XML', python: 'Python', rust: 'Rust', go: 'Go', bash: 'Shell', markdown: 'Markdown', yaml: 'YAML', ini: 'Config', java: 'Java', kotlin: 'Kotlin', c: 'C', cpp: 'C++', csharp: 'C#', php: 'PHP', ruby: 'Ruby', sql: 'SQL', lua: 'Lua', swift: 'Swift', powershell: 'PowerShell', dockerfile: 'Dockerfile' };
    const FC = { ts: '#3178c6', tsx: '#3178c6', js: '#f1e05a', jsx: '#f1e05a', mjs: '#f1e05a', cjs: '#f1e05a', json: '#cbb64a', css: '#8a63d2', scss: '#c6538c', html: '#e34c26', vue: '#41b883', svg: '#ffb13b', py: '#3572A5', go: '#00ADD8', rs: '#dea584', sh: '#89e051', bash: '#89e051', md: '#519aba', yml: '#cb171e', yaml: '#cb171e', toml: '#9c4221', java: '#b07219', kt: '#a97bff', c: '#6e8bb0', h: '#6e8bb0', cpp: '#f34b7d', cs: '#178600', php: '#4f5d95', rb: '#cc342d', sql: '#e38c00', lua: '#5b6cff', swift: '#f05138', dockerfile: '#2f8fb5' };
    const IMG = /\.(png|jpe?g|gif|webp|avif|ico|bmp)$/i;
    const extOf = (p) => { const b = p.split('/').pop().toLowerCase(); return b.includes('.') ? b.split('.').pop() : b; };
    const SV = { dir: '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1.5 4a1.5 1.5 0 0 1 1.5-1.5h2.9c.4 0 .8.2 1.1.5l.9 1h4.6A1.5 1.5 0 0 1 14 5.5v6A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5z" fill="currentColor"/></svg>', file: '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 1.7h4.6L12.3 5.4V13.5a.8.8 0 0 1-.8.8H4a.8.8 0 0 1-.8-.8v-11a.8.8 0 0 1 .8-.8z"/><path d="M8.4 1.9v3.6h3.6"/></svg>', up: '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4 3 7.5 6.5 11M3.5 7.5h6a3 3 0 0 1 3 3V12"/></svg>' };
    const ico = (p, dir) => dir ? `<span class="fi dir">${SV.dir}</span>` : `<span class="fi" style="color:${FC[extOf(p)] || 'var(--muted)'}">${SV.file}</span>`;
    const enc = (p) => p.split('/').filter(Boolean).map(encodeURIComponent).join('/');
    const encRef = (r) => r.split('/').map(encodeURIComponent).join('/');
    const href = (p, ref = curRef) => p ? `${base}/${encRef(ref)}/${enc(p)}` : ref === d.defaultBranch ? base : `${base}/${encRef(ref)}`;
    // longest known branch/tag that prefixes the remaining segments; unknown refs fall back to the first segment
    const splitRef = (rest) => {
      const j = rest.join('/'), hit = REFS.filter((b) => j === b || j.startsWith(b + '/')).sort((a, b) => b.length - a.length)[0];
      if (hit) return { ref: hit, p: j.slice(hit.length + 1) };
      return rest.length ? { ref: rest[0], p: rest.slice(1).join('/') } : { ref: d.defaultBranch, p: '' };
    };
    const special = (r) => { const w = lc(r[0]); return !REFS.some((b) => r.join('/') === b || r.join('/').startsWith(b + '/')) && r.length >= 2 && ((['pull', 'pulls', 'issue', 'issues'].includes(w) && /^\d+$/.test(r[1])) || (['commit', 'commits'].includes(w) && /^[0-9a-f]{7,40}$/i.test(r[1]))); };
    const SUBW = ['issue', 'issues', 'star', 'stars', 'stargazers', 'fork', 'forks', 'license', 'licence'];
    const lc = (x) => (x || '').toLowerCase();
    // path after /repos/ -> segments following the repo name (null when the URL is for another repo)
    const ORG = d.base !== '/repos/' + d.name;
    const restOf = (path) => {
      const ps = path.split('/').filter(Boolean).slice(1).map((x) => { try { return decodeURIComponent(x); } catch { return x; } });
      if (ORG) return lc(ps[0]) === lc(d.owner) && lc(ps[1]) === lc(d.name) ? ps.slice(2) : null;
      if (lc(ps[0]) === lc(d.name)) return ps.slice(1);
      return null;
    };
    const parseLoc = () => {
      const { ref, p } = splitRef(restOf(location.pathname) || []);
      const m = /^#L(\d+)(?:-L?(\d+))?$/.exec(location.hash);
      return { ref, p, a: m ? +m[1] : 0, b: m ? +(m[2] || m[1]) : 0 };
    };
    let curDir = null, openPath = null, flt = '', seq = 0;
    const markActive = () => document.querySelectorAll('#files .fr').forEach((a) => a.classList.toggle('on', a.dataset.p === openPath));
    const drawList = () => {
      const q = flt.trim().toLowerCase(), nm = (t) => t.p.split('/').pop();
      const rows = (kids[curDir] || []).slice().sort((a, b) => b.d - a.d || a.p.localeCompare(b.p)).filter((t) => !q || nm(t).toLowerCase().includes(q));
      const up = curDir && !q ? `<a class="fr up" href="${esc(href(curDir.includes('/') ? curDir.slice(0, curDir.lastIndexOf('/')) : ''))}"><span class="fi">${SV.up}</span><span class="nm">Parent directory</span></a>` : '';
      $('files').innerHTML = up + rows.map((t, i) => `<a class="fr${t.p === openPath ? ' on' : ''}" style="--i:${Math.min(i, 14)}" href="${esc(href(t.p))}" data-p="${esc(t.p)}">${ico(t.p, t.d)}<span class="nm">${esc(nm(t))}</span><span class="sz">${t.d ? (kids[t.p] || []).length + ' items' : fmt(t.s)}</span></a>`).join('') || `<div class="src-empty">${q ? 'No matching files' : 'Empty'}</div>`;
    };
    const go = (dir) => {
      if (dir === curDir) return;
      curDir = dir; flt = ''; $('find').value = '';
      const parts = dir ? dir.split('/') : [];
      $('crumb').innerHTML = `<a href="${esc(href(''))}"${parts.length ? '' : ' aria-current="page"'}>${esc(d.name)}</a>` + parts.map((x, i) => `<i class="sep">/</i><a href="${esc(href(parts.slice(0, i + 1).join('/')))}"${i === parts.length - 1 ? ' aria-current="page"' : ''}>${esc(x)}</a>`).join('');
      drawList();
    };
    $('find').oninput = (e) => { flt = e.target.value; drawList(); };
    $('find').onkeydown = (e) => { if (e.key === 'Enter') { const a = $('files').querySelector('.fr:not(.up)'); if (a) a.click(); } else if (e.key === 'Escape' && e.target.value) { e.target.value = ''; flt = ''; drawList(); e.stopPropagation(); } };

    // line-by-line syntax highlighting: split highlight.js output on newlines, re-opening spans that cross lines
    const splitLines = (html) => {
      const out = [], stack = [], re = /<span[^>]*>|<\/span>|\n/g;
      let cur = '', last = 0, m;
      while ((m = re.exec(html))) {
        cur += html.slice(last, m.index); last = re.lastIndex;
        if (m[0] === '\n') { out.push(cur + '</span>'.repeat(stack.length)); cur = stack.join(''); }
        else { m[0] === '</span>' ? stack.pop() : stack.push(m[0]); cur += m[0]; }
      }
      out.push(cur + '</span>'.repeat(stack.length));
      return out;
    };
    let hlp;
    const hlLines = async (text, lang) => {
      if (!lang || text.length > 120000) return null;
      try {
        hlp ||= import('https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/+esm');
        const m = (await hlp).default;
        return splitLines(m.highlight(text, { language: lang, ignoreIllegals: true }).value);
      } catch { return null; }
    };
    const wrapPref = () => { try { return localStorage.getItem('srcwrap') === '1'; } catch { return false; } };
    const hideViewer = () => { seq++; openPath = null; $('srcwrap').classList.remove('open'); $('viewer').hidden = true; $('viewer').innerHTML = ''; markActive(); };
    const open = async (p, a, b, jump) => {
      openPath = p; markActive();
      const v = $('viewer'), tok = ++seq, name = p.split('/').pop(), dirp = p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
      const lang = EXT[extOf(p)], ghUrl = `${d.url}/blob/${encRef(curRef)}/${enc(p)}`;
      const rawUrl = `https://raw.githubusercontent.com/${d.owner}/${d.name}/${encRef(curRef)}/${enc(p)}`;
      const head = (meta, extra) => `<div class="v-head"><div class="v-title">${ico(p, false)}<span class="v-name"><span class="v-dir">${esc(dirp)}</span><b>${esc(name)}</b></span></div><div class="v-meta">${meta}</div><div class="v-acts">${extra || ''}<a href="${esc(rawUrl)}" target="_blank" rel="noopener">Raw</a><a href="${esc(ghUrl)}" target="_blank" rel="noopener">GitHub ↗</a><button type="button" data-a="close" aria-label="Close file">✕</button></div></div>`;
      const fresh = !$('srcwrap').classList.contains('open');
      $('srcwrap').classList.add('open');
      v.hidden = false;
      v.innerHTML = head('Loading…') + '<div class="v-state">Loading…</div>';
      const reveal = () => v.scrollIntoView({ behavior: jump ? 'instant' : 'smooth', block: jump || fresh ? 'start' : 'nearest' });
      let f;
      try { f = await (await fetch(`/api/repo-file?name=${encodeURIComponent(full)}&path=${encodeURIComponent(p)}&ref=${encodeURIComponent(curRef)}`)).json(); }
      catch { if (tok === seq) v.innerHTML = head('') + '<div class="v-state">Failed to load</div>'; return; }
      if (tok !== seq) return;
      if (f.text == null) {
        v.innerHTML = head(fmt(f.size)) + (IMG.test(p) ? `<div class="v-img"><img src="${esc(rawUrl)}" alt="${esc(name)}"></div>` : `<div class="v-state">Binary or large file (${fmt(f.size)}). <a href="${esc(ghUrl)}" target="_blank" rel="noopener">View on GitHub ↗</a></div>`);
        reveal();
        return;
      }
      const lines = f.text.replace(/\n$/, '').split('\n');
      let selA = a || 0, selB = b || 0;
      const wrap = wrapPref();
      v.innerHTML = head(`${LN[lang] || 'Plain text'} · ${lines.length.toLocaleString()} lines · ${fmt(f.size)}`, `<button type="button" data-a="wrap" aria-pressed="${wrap}">Wrap</button><button type="button" data-a="copy">Copy</button>`) +
        `<div class="code${wrap ? ' wrap' : ''}" role="region" aria-label="${esc(name)}" tabindex="0">${lines.map((l, i) => `<div class="l"><span class="n" data-n="${i + 1}"></span><span class="c">${esc(l)}</span></div>`).join('')}</div>`;
      const code = v.querySelector('.code');
      const lo = () => Math.min(selA, selB), hi = () => Math.max(selA, selB);
      const paint = () => {
        code.querySelectorAll('.l.sel').forEach((e) => e.classList.remove('sel'));
        if (selA) for (let i = lo(); i <= hi(); i++) code.children[i - 1] && code.children[i - 1].classList.add('sel');
      };
      paint();
      if (selA && code.children[lo() - 1]) code.scrollTop = Math.max(0, code.children[lo() - 1].offsetTop - code.clientHeight / 3);
      code.onclick = (e) => {
        const n = e.target.closest('.n'); if (!n) return;
        const i = +n.dataset.n;
        if (e.shiftKey && selA) selB = i; else if (selA === i && selB === i) selA = selB = 0; else selA = selB = i;
        paint();
        history.replaceState(null, '', href(p) + (selA ? '#L' + lo() + (hi() > lo() ? '-L' + hi() : '') : ''));
      };
      v.querySelector('.v-acts').onclick = async (e) => {
        const btn = e.target.closest('button'); if (!btn) return;
        if (btn.dataset.a === 'close') { history.pushState(null, '', href(curDir)); hideViewer(); }

    };
    const syncRef = () => {
      const sel = $('refSel'), opt = (n) => `<option value="${esc(n)}">${esc(n)}</option>`;

    $('refSel').onchange = (e) => nav(href(openPath || curDir || '', e.target.value));

    const onLink = (e) => {
      const a = e.target.closest('a[href]');

    }

    const TAB = SUB === 'thread' ? 'issues' : SUB;

      .map(([k, l, c]) => `<a href="${base}${k ? '/' + k : ''}" class="${k === TAB ? 'on' : ''}"${k === TAB ? ' aria-current="page"' : ''}>${l}${c !== '' ? `<span class="pill">${n(c)}</span>` : ''}</a>`).join('');
    $('app').hidden = false;
    if (SUB) {
      $('app').classList.add('sub'); $('subBlk').hidden = false;
      const blk = $('subBlk');
      const getX = async (kind, q) => { const r = await fetch(`/api/repo-extra?name=${encodeURIComponent(full)}&kind=${kind}${q || ''}`); if (!r.ok) throw 0; return r.json(); };
      const SVC = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>';
      const list = (kind, q, row, empty, cls) => {
        let page = 1, gen = 0;
        const L = blk.querySelector('.sb-list'), M = blk.querySelector('.sb-more');
        L.classList.add(cls);
        const load = async (reset) => {
          const g = ++gen;
          if (reset) { page = 1; L.innerHTML = ''; }
          M.innerHTML = '<span class="sb-load">Loading…</span>';
          try {
            const r = await getX(kind, `&page=${page}${q()}`);
            if (g !== gen) return;
            L.insertAdjacentHTML('beforeend', r.items.map(row).join(''));
            if (!L.children.length) L.innerHTML = `<div class="src-empty">${empty()}</div>`;
            M.innerHTML = r.more ? '<button type="button" class="more">Load more</button>' : '';
            page++;
          } catch { if (g === gen) M.innerHTML = '<span class="sb-load">Failed to load</span>'; }
        };
        M.onclick = (e) => { if (e.target.closest('.more')) load(); };
        return load;
      };
      const shell = (title, ctl) => { blk.innerHTML = `<div class="sb-head"><h2>${title}</h2>${ctl || ''}</div><div class="sb-list"></div><div class="sb-more"></div>`; };
      if (SUB === 'thread' || SUB === 'commit') {
      const n_ = (x) => Number(x).toLocaleString();
      const parts = restOf(location.pathname) || [];
      const A = (u) => `<img class="th-av" src="${esc(u.avatar)}${u.avatar ? '&s=48' : ''}" alt="" loading="lazy">`;
      const ROLE = { OWNER: 'Owner', MEMBER: 'Member', COLLABORATOR: 'Collaborator', CONTRIBUTOR: 'Contributor' };
      const role = (a) => (ROLE[a] ? `<span class="th-role">${ROLE[a]}</span>` : '');
      const labelsOf = (l) => l.map((x) => `<span class="lb" style="--c:#${esc(x.color)}">${esc(x.name)}</span>`).join('');
      const dline = (l) => { const c = l[0] === '+' ? 'a' : l[0] === '-' ? 'd' : l.startsWith('@@') ? 'h' : ''; return `<div class="dl ${c}">${esc(l) || ' '}</div>`; };
      const diffs = (files, cut) => {
        const tot = files.reduce((s, f) => [s[0] + f.add, s[1] + f.del], [0, 0]);
        const rows = files.map((f) => `<details class="df"${files.length <= 12 ? ' open' : ''}><summary><span class="df-n">${esc(f.prev ? f.prev + ' → ' : '')}${esc(f.name)}</span><span class="df-s"><b class="pa">+${f.add}</b> <b class="pd">−${f.del}</b></span></summary>${f.patch ? `<div class="dp">${f.patch.split('\n').map(dline).join('')}</div>` : `<div class="src-empty">${f.status === 'renamed' ? 'Renamed without changes' : 'No text diff (binary or too large)'} · <a href="${esc(f.blob)}" target="_blank" rel="noopener">View on GitHub ↗</a></div>`}</details>`).join('');
        return `<div class="df-sum"><b>${files.length}${cut ? '+' : ''}</b> files changed · <b class="pa">+${tot[0]}</b> <b class="pd">−${tot[1]}</b></div>${rows}${cut ? '<p class="th-note">Showing the first files only.</p>' : ''}`;
      };
      const get = async (path) => { const r = await fetch(path); if (!r.ok) throw 0; return r.json(); };
      const fail = (t) => { blk.innerHTML = `<div class="src"><div class="src-empty">${t}</div></div>`; };
      const stateOf = (t) => (t.merged ? ['merged', 'Merged'] : t.draft ? ['draft', 'Draft'] : t.state === 'open' ? ['open', 'Open'] : [t.kind === 'pull' ? 'closed' : (t.reason === 'not_planned' ? 'closed' : 'done'), t.kind === 'issue' && t.reason !== 'not_planned' ? 'Closed' : 'Closed']);
      const card = (u, at, body, extra) => `<div class="th-card">${A(u)}<div class="th-box"><div class="th-hd"><a href="${esc(u.url)}" target="_blank" rel="noopener"><b>${esc(u.login)}</b></a>${extra || ''}<span class="th-at">${ago(at)}</span></div><div class="md th-body">${body || '<p class="th-none">No description provided.</p>'}</div></div></div>`;
      const REVS = { APPROVED: ['ok', 'approved these changes'], CHANGES_REQUESTED: ['no', 'requested changes'], COMMENTED: ['', 'reviewed'], DISMISSED: ['', 'review dismissed'] };
      const tl = (e) => {
        if (e.k === 'c') return card(e.user, e.at, e.body, role(e.assoc));
        const [cls, txt] = REVS[e.state] || ['', 'reviewed'];
        const inl = e.inline.map((c) => `<div class="th-inl"><div class="th-ip">${esc(c.path)}${c.line ? ':' + c.line : ''}</div><div class="th-hd"><b>${esc(c.user.login)}</b></div><div class="md th-body">${c.body}</div></div>`).join('');
        return `<div class="th-card">${A(e.user)}<div class="th-box"><div class="th-hd"><a href="${esc(e.user.url)}" target="_blank" rel="noopener"><b>${esc(e.user.login)}</b></a><span class="th-rv ${cls}">${txt}</span><span class="th-at">${ago(e.at)}</span></div>${e.body ? `<div class="md th-body">${e.body}</div>` : ''}${inl}</div></div>`;
      };
      (async () => {
        try {
          if (SUB === 'commit') {
            const c = await get(`/api/repo-commit?name=${encodeURIComponent(full)}&sha=${encodeURIComponent(parts[1])}`);
            const [head, ...rest] = c.msg.split('\n');
            blk.innerHTML = `<div class="th-top"><h2 class="th-title">${esc(head)}</h2></div>${rest.join('\n').trim() ? `<pre class="th-msg">${esc(rest.join('\n').trim())}</pre>` : ''}<div class="th-meta">${c.author.login !== 'ghost' ? A(c.author) : ''}<span><b>${esc(c.author.login !== 'ghost' ? c.author.login : c.authorName)}</b> committed ${ago(c.at)}</span><code class="th-sha">${esc(c.sha.slice(0, 7))}</code>${c.parents.map((p) => `<a class="th-par" href="${base}/commit/${esc(p)}">parent ${esc(p.slice(0, 7))}</a>`).join('')}<a class="th-gh" href="${esc(c.url)}" target="_blank" rel="noopener">GitHub ↗</a></div>${diffs(c.files, c.filesCut)}`;
            return;
          }
          const n = parts[1], part = (parts[2] || '').toLowerCase();
          const t = await get(`/api/repo-thread?name=${encodeURIComponent(full)}&n=${encodeURIComponent(n)}`);
          const [sc, sl] = stateOf(t), pr = t.kind === 'pull', root = `${base}/${pr ? 'pull' : 'issues'}/${t.n}`;
          let tabs = '', main = '';
          if (pr) {
            tabs = `<nav class="th-tabs"><a href="${root}" class="${part ? '' : 'on'}">Conversation<span class="pill">${n_(t.commentsCount)}</span></a><a href="${root}/commits" class="${part === 'commits' ? 'on' : ''}">Commits<span class="pill">${t.info.commits}</span></a><a href="${root}/files" class="${part === 'files' ? 'on' : ''}">Files changed<span class="pill">${t.info.files}</span></a></nav>`;
          }
          const hd = `<div class="th-top"><h2 class="th-title">${esc(t.title)} <span class="th-num">#${t.n}</span></h2><div class="th-sub"><span class="th-st ${sc}">${sl}</span><span>${pr && t.merged ? `<b>${esc((t.mergedBy || t.author).login)}</b> merged ${ago(t.mergedAt)}` : `<b>${esc(t.author.login)}</b> opened ${ago(t.at)}`}${pr ? ` · <code>${esc(t.info.head)}</code> → <code>${esc(t.info.base)}</code>` : ''}</span><a class="th-gh" href="${esc(t.url)}" target="_blank" rel="noopener">GitHub ↗</a></div></div>${tabs}`;
          if (pr && part === 'files') main = diffs((await get(`/api/repo-thread?name=${encodeURIComponent(full)}&n=${t.n}&part=files`)).files, t.info.files > 100);
          else if (pr && part === 'commits') main = `<div class="sb-list rows">${(await get(`/api/repo-thread?name=${encodeURIComponent(full)}&n=${t.n}&part=commits`)).commits.map((c) => `<a class="ir" href="${base}/commit/${esc(c.sha)}"><div class="ib"><div class="it">${esc(c.msg)}</div><div class="is">${esc(c.author)} · ${ago(c.at)}</div></div><span class="ic">${esc(c.sha.slice(0, 7))}</span></a>`).join('')}</div>`;
          else {
            const meta = [t.labels.length && `<div class="th-row"><span>Labels</span>${labelsOf(t.labels)}</div>`, t.assignees.length && `<div class="th-row"><span>Assignees</span>${t.assignees.map((u) => `<a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.login)}</a>`).join(', ')}</div>`, t.milestone && `<div class="th-row"><span>Milestone</span>${esc(t.milestone)}</div>`, pr && `<div class="th-row"><span>Changes</span><b class="pa">+${t.info.additions}</b> <b class="pd">−${t.info.deletions}</b> in ${t.info.files} files</div>`].filter(Boolean).join('');
            main = `${meta ? `<div class="th-meta2">${meta}</div>` : ''}<div class="th-tl">${card(t.author, t.at, t.body, role(t.assoc))}${t.timeline.map(tl).join('')}</div>${t.commentsCut ? '<p class="th-note">Showing the first 100 comments. <a href="' + esc(t.url) + '" target="_blank" rel="noopener">See the rest on GitHub ↗</a></p>' : ''}`;
          }
          blk.innerHTML = hd + main;
        } catch { fail(SUB === 'commit' ? 'Commit not found' : 'Not found'); }
      })();
      } else if (SUB === 'issues') {
        let st = 'open';
        shell('Issues and pull requests', '<div class="seg" role="group" aria-label="State"><button type="button" data-s="open" aria-pressed="true">Open</button><button type="button" data-s="closed" aria-pressed="false">Closed</button></div>');
        const row = (i) => `<a class="ir" href="${base}/${i.pr ? 'pull' : 'issues'}/${i.n}"><span class="ist ${i.pr ? 'pr ' : ''}${i.merged ? 'merged' : i.state}" role="img" aria-label="${i.pr ? 'Pull request, ' : 'Issue, '}${i.merged ? 'merged' : i.state}"></span><div class="ib"><div class="it">${esc(i.title)}${i.labels.map((l) => `<span class="lb" style="--c:#${l.color}">${esc(l.name)}</span>`).join('')}</div><div class="is">#${i.n} ${i.state === 'open' ? 'opened ' + ago(i.at) : (i.merged ? 'merged ' : 'closed ') + ago(i.closedAt || i.at)} by ${esc(i.author)}${i.pr ? ' · pull request' : ''}</div></div>${i.comments ? `<span class="ic">${SVC}${i.comments}</span>` : ''}</a>`;
        const load = list('issues', () => '&state=' + st, row, () => `No ${st} issues`, 'rows');
        blk.querySelector('.seg').onclick = (e) => { const b = e.target.closest('button'); if (!b || b.dataset.s === st) return; st = b.dataset.s; blk.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b)); load(true); };
        load(true);
      } else if (SUB === 'stars') {
        shell(`Stargazers <span class="pill">${n(d.stars)}</span>`);
        list('stars', () => '', (u) => `<a class="sg" href="${esc(u.url)}" target="_blank" rel="noopener"><img src="${esc(u.avatar)}&s=72" alt="" loading="lazy"><span class="sgt"><b>${esc(u.login)}</b><span>starred ${ago(u.at)}</span></span></a>`, () => 'No stars yet', 'grid')(true);
      } else if (SUB === 'forks') {
        shell(`Forks <span class="pill">${n(d.forks)}</span>`);
        list('forks', () => '', (f) => `<a class="ir" href="${esc(f.url)}" target="_blank" rel="noopener"><img class="fa" src="${esc(f.avatar)}&s=72" alt="" loading="lazy"><div class="ib"><div class="it">${esc(f.full)}</div><div class="is">${esc(f.description) || 'No description'}</div></div><span class="ic">★ ${n(f.stars)} · ${ago(f.at)}</span></a>`, () => 'No forks yet', 'rows')(true);
      } else {
        shell('License');
        (async () => {
          try {
            const L = await getX('license');
            const col = (t, c, a) => `<div class="lc ${c}"><h3>${t}</h3><ul>${a.length ? a.map((k) => `<li>${esc(k.replace(/-/g, ' ').replace(/^./, (x) => x.toUpperCase()))}</li>`).join('') : '<li class="none">—</li>'}</ul></div>`;
            const lines = L.body.replace(/\n$/, '').split('\n');
            blk.innerHTML = `<div class="sb-head"><h2>License</h2></div><div class="lic"><div class="lic-top"><b>${esc(L.name)}</b>${L.spdx ? `<span class="chip">${esc(L.spdx)}</span>` : ''}</div>${L.description ? `<p class="lic-d">${esc(L.description)}</p>` : ''}${L.permissions.length + L.conditions.length + L.limitations.length ? `<div class="lic-cols">${col('Permissions', 'p', L.permissions)}${col('Conditions', 'c', L.conditions)}${col('Limitations', 'l', L.limitations)}</div>` : ''}</div><div class="viewer"><div class="v-head"><div class="v-title"><b>${esc(L.file)}</b></div><div class="v-meta">${lines.length} lines · ${fmt(L.size)}</div><div class="v-acts"><a href="${esc(L.url)}" target="_blank" rel="noopener">GitHub ↗</a></div></div><div class="code wrap" role="region" aria-label="${esc(L.file)}" tabindex="0">${lines.map((l, i) => `<div class="l"><span class="n" data-n="${i + 1}"></span><span class="c">${esc(l)}</span></div>`).join('')}</div></div>`;
          } catch { blk.innerHTML = '<div class="sb-head"><h2>License</h2></div><div class="src"><div class="src-empty">No license file in this repository</div></div>'; }
        })();
      }
    } else route(true);
    syncRef();
    $('commits').innerHTML = d.commits.map((c) => `<a class="item" href="${base}/commit/${esc(c.url.split('/').pop())}"><div><div class="t">${esc(c.message)}</div><div class="s">${esc(c.author)}</div></div><div class="r">${ago(c.date)}</div></a>`).join('') || '<div class="empty">No commits</div>';
    $('foot').textContent = `Created ${new Date(d.createdAt).toLocaleDateString()} · ${d.defaultBranch}`;
    $('app').hidden = false;
  } catch (e) { console.error("repo", e && e.stack || e); $("err").hidden = false; }
  document.body.classList.remove('loading');
})();
</script>
<script src="/router.js?v=20261115m"></script>
