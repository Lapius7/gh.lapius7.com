<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List · GitHub</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lapius7 · GitHub">
<meta property="og:title" content="__OGNAME__ · GitHub">
<meta property="og:image" content="__OGIMG__">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232ecc8f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css?v=20261124a">
</head>
<body class="loading">
<div id="tip"></div>
<button class="theme" id="theme" aria-label="Toggle theme">◐</button>
<div class="banner"><canvas id="bn"></canvas></div>
<main class="wrap">
  <div id="loader" role="status" aria-live="polite"><div class="wave" aria-hidden="true"></div><span>Loading GitHub data<b class="dots"></b></span></div>
  <a class="back" href="/overview">← Overview</a>
  <nav class="tabs ptabs rtabs" id="ltabs" aria-label="Profile lists"></nav>
  <section class="blk" id="lblk" style="margin-top:0"><div class="sb-list" id="llist"></div><div class="sb-more" id="lmore"></div></section>
</main>
<script src="/common.js?v=20261012d"></script>
<script type="text/page">
const KIND = '__KIND__';
const TABS = [['followers', 'Followers'], ['following', 'Following'], ['stars', 'Stars']];
const n = (v) => Number(v || 0).toLocaleString('en-US');
const row = {
  followers: (u) => `<a class="ir" href="${esc(u.url)}" target="_blank" rel="noopener"><img class="lav" src="${esc(u.avatar)}" alt="" loading="lazy"><div class="ib"><div class="it">${esc(u.name || u.login)}</div><div class="im">@${esc(u.login)}${u.bio ? ' · ' + esc(u.bio) : ''}</div></div></a>`,
  stars: (r) => `<a class="ir" href="/repos/${encodeURIComponent(r.name)}"><div class="ib"><div class="it">${esc(r.name)}</div><div class="im">${esc(r.description)}</div><div class="im">${r.lang ? `<span class="dot" style="background:${esc(r.lang.color || '#888')}"></span>${esc(r.lang.name)} · ` : ''}★ ${n(r.stars)} · ${n(r.forks)} forks · ${esc(ago(r.at))}</div></div></a>`,
  gists: (g) => `<a class="ir" href="/gists/${esc(g.id)}"><div class="ib"><div class="it">${esc(g.files[0] || g.id)}</div><div class="im">${esc(g.description)}</div><div class="im">★ ${n(g.stars)} · ${esc(ago(g.at))}</div></div></a>`,
}; row.following = row.followers;
const tabs = (counts) => { $('ltabs').innerHTML = TABS.map(([k, l]) => `<a href="/${k}" class="${k === KIND ? 'on' : ''}"${k === KIND ? ' aria-current="page"' : ''}>${l}${counts[k] != null ? `<span class="pill">${n(counts[k])}</span>` : ''}</a>`).join(''); };
tabs({});
(async () => {
  try { const s = await (await fetch('/api/stats?period=week')).json(); tabs({ followers: s.user.followers, following: s.user.following, stars: s.user.stars, gists: s.user.gists }); } catch {}
})();
let after = '', busy = false;
const load = async () => {
  if (busy) return; busy = true;
  const L = $('llist'), M = $('lmore');
  M.innerHTML = '<span class="sb-load">Loading…</span>';
  try {
    const r = await fetch(`/api/people?kind=${KIND}${after ? '&after=' + encodeURIComponent(after) : ''}`);
    if (!r.ok) throw 0;
    const d = await r.json();
    L.insertAdjacentHTML('beforeend', d.items.map(row[KIND]).join(''));
    if (!L.children.length) L.innerHTML = '<div class="src-empty">Nothing here yet</div>';
    after = d.next; M.innerHTML = d.next ? '<button type="button" class="more">Load more</button>' : '';
  } catch { M.innerHTML = '<span class="sb-load">Failed to load</span>'; }
  document.body.classList.remove('loading'); busy = false;
};
$('lmore').onclick = (e) => { if (e.target.closest('.more')) load(); };
load();
window.SPA_PAGE = null;
</script>
<script src="/router.js?v=20261115m"></script>
<script src="/fx.js?v=20261115m"></script>
<script src="/fx2.js?v=20261121e"></script>
</body>
</html>
